version: "3"
services:
  db1:
    image: mysql:8
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=Cherry@1
      - MYSQL_USER=ritik
      - MYSQL_PASSWORD=Cherry@1
      - MYSQL_DB="prodcrm"
    volumes:
      - db1-data:/var/lib/mysql/data
    ports:
      - "3001:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  db2:
    image: mysql:8
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=Cherry@1
      - MYSQL_USER="ritik"
      - MYSQL_PASSWORD="Cherry@1"
      - MYSQL_DB="testcrm"
    volumes:
      - db2-data:/var/lib/mysql/data
    ports:
      - "3000:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10      

  mycrm:
    build: .
    depends_on:
      - db1
    ports:
      - "63193:63193"
    environment:
      PORT: 63193
      DB_DIALECT: mysql
      DB_HOST: db1
      DB_PORT: 3306
      DB_USER: ritik
      DB_PASSWORD: Cherry@1
      DB_NAME: prodcrm
      JWT_SECRET: a0f937n4vvm82-345cb288mgnoi
      ENVIRONMENT: PRODUCTION
      #resend key
      RESEND_API_KEY: "re_2CBnDRDQ_5hnTYsmsPGy3gM4XAdpHrMBa"
      #aws credentials
      AWS_ACCESS_KEY_ID: AKIAWNHTHUAKJHBJBHU4
      AWS_SECRET_ACCESS_KEY: 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
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: myactivitycrmbucket

  testcrm:
    build: .
    depends_on:
      - db2
    ports:
      - "5001:63193"
    environment:
      DB_DIALECT: mysql
      DB_HOST: db2
      DB_PORT: 3306
      DB_USER: ritik
      DB_PASSWORD: Cherry@1
      DB_NAME: prodcrm
      JWT_SECRET: a0f937n4vvm82-345cb288mgnoi
      ENVIRONMENT: PRODUCTION
      #resend key
      RESEND_API_KEY: re_2CBnDRDQ_5hnTYsmsPGy3gM4XAdpHrMBa
      #aws credentials
      AWS_ACCESS_KEY_ID: AKIAWNHTHUAKJHBJBHU4
      AWS_SECRET_ACCESS_KEY: 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
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: myactivitycrmbucket
